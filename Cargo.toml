[workspace]
members = [
  "iroh-mainline-address-lookup",
  "iroh-mdns-address-lookup",
]

resolver = "2"

[profile.release]
debug = true

[profile.dev-ci]
inherits = 'dev'
opt-level = 1

[profile.optimized-release]
inherits = 'release'
debug = false
lto = true
debug-assertions = false
opt-level = 3
panic = 'abort'
incremental = false

[workspace.lints.rust]
missing_debug_implementations = "warn"

# We use this --cfg for documenting the cargo features on which an API
# is available.  To preview this locally use: RUSTFLAGS="--cfg
# iroh_docsrs cargo +nightly doc --all-features".  We use our own
# iroh_docsrs instead of the common docsrs to avoid also enabling this
# feature in any dependencies, because some indirect dependencies
# require a feature enabled when using `--cfg docsrs` which we can not
# do.  To enable for a crate set `#![cfg_attr(iroh_docsrs,
# feature(doc_cfg))]` in the crate.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(iroh_docsrs)", "cfg(skip_patchbay)"] }

[workspace.lints.clippy]
unused-async = "warn"

[patch.crates-io]
# n0-watcher 1.0.0 predates upstream Waker cleanup fixes #63 and #64.
# Consumers must repeat this patch in their workspace root until a fixed release exists.
n0-watcher = { git = "https://github.com/n0-computer/n0-watcher.git", rev = "3b8cd02b29343f901ab3dba9c49c55480c5c9c31" }
